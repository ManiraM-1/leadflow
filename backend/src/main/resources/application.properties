spring.application.name=leadflow
server.port=${PORT:8080}

# Defaults to a local H2 file database so the API runs with zero setup.
# Docker Compose overrides these with PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/leadflow}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Fallback time zone for "today" when the client doesn't send ?tz=
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Insert demo leads on startup when the database is empty
app.seed.enabled=${SEED_DATA:true}
